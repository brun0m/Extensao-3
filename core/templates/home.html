<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estudos</title>
</head>
<body>
  <h1>Gerador Educacional</h1>
  <form method="post">
    {% csrf_token %}
    <input type="text" name="materia" placeholder="Digite uma matéria..." required>
    <button type="submit">Gerar</button>
  </form>

  {% if resumo %}
    <h2>📘 Resumo</h2>
    <pre>{{ resumo }}</pre>
  {% endif %}

  {% if flashcards %}
    <h2>🃏 Flashcards</h2>
    <pre>{{ flashcards }}</pre>
  {% endif %}

  {% if quiz %}
    <h2>📝 Quiz</h2>
    <pre>{{ quiz }}</pre>
  {% endif %}
</body>
</html>
